[project]
name = "aipvs-worker"
version = "0.0.0"
description = "AI Product Video Studio — async job worker (Celery). Consumes the video generation, TTS and QC queues."
requires-python = ">=3.11"
dependencies = ["aipvs-backend-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipvs_worker"]
