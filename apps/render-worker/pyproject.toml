[project]
name = "aipvs-render-worker"
version = "0.0.0"
description = "AI Product Video Studio — FFmpeg render worker. Turns a Timeline into a final MP4."
requires-python = ">=3.11"
dependencies = ["aipvs-backend-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipvs_render_worker"]
