[project]
name = "aipvs-api"
version = "0.0.0"
description = "AI Product Video Studio — HTTP API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    # The API enqueues Celery tasks the worker defines (§22).
    "aipvs-worker",
    "aipvs-backend-core",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipvs_api"]
