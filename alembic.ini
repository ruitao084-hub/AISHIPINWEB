# Alembic configuration (taskbook §73, P1-T05).
#
# The database URL is intentionally NOT set here — env.py reads it from
# application settings so there is exactly one DATABASE_URL and no credentials
# in a tracked file (§7, §138).

[alembic]
script_location = infra/migrations
prepend_sys_path = .
# Timestamped, slugged revision filenames sort chronologically and read as a
# changelog. UTC so ordering does not depend on the author's timezone (§129).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]
# Generated migrations are held to the same standard as handwritten code.
hooks = ruff_format,ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
