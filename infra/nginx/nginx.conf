# ===========================================================================
# TLS termination and reverse proxy (§61, §100, P23-T07)
# ===========================================================================
# Certificates are mounted at /etc/nginx/certs. Obtain them from Let's Encrypt
# or your platform's certificate manager — this file assumes they exist and
# does not fetch them, because a proxy that can write to its own certificate
# store is a proxy that can be made to serve someone else's.
#
# Three settings here are load-bearing rather than convention, and each is
# explained where it appears: the upload size limit, the read timeout on the
# API, and `X-Forwarded-Proto`.
# ===========================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The request id is echoed into every log line the API writes (§63), so
    # putting it in the access log too makes a proxy log and an application
    # log joinable on one field.
    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"request_id":"$http_x_request_id","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # nginx advertises its exact version by default, which tells a scanner
    # which CVEs to try first.
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Media never passes through here — uploads go straight to storage with a
    # presigned URL and downloads come back the same way (§12, §60). So this
    # limit only has to cover JSON bodies and PHASE 21's spreadsheet import,
    # and keeping it small is what stops a 2 GB POST from occupying a proxy
    # worker for the length of the upload.
    client_max_body_size 8m;
    client_body_timeout 30s;

    # ---- rate limiting -------------------------------------------------
    # A coarse edge limit *in addition to* §123's per-workspace limits in the
    # application. This one exists to stop traffic that never reaches a
    # handler; the application's exist to stop traffic that does.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream web_backend {
        server web:3000;
        keepalive 32;
    }

    # ---- HTTP: redirect, except for the ACME challenge -----------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS ---------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated and their presence
        # is what a downgrade attack needs.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS is set here *and* by the application's middleware. Two places
        # because either can be the last hop in some deployment, and a header
        # that only one of them sets is a header that is missing whenever the
        # other terminates.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /api/ {
            limit_req zone=general burst=60 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Without this the application sees plain HTTP, never sends HSTS,
            # and marks the refresh cookie insecure. `TRUST_PROXY_HEADERS=true`
            # is what makes the application believe it — and that setting is
            # only safe *because* this proxy is in front.
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Long, because §22's endpoints return in milliseconds but the
            # OpenAPI export and a large batch import do not. Still finite: an
            # infinite timeout turns one wedged handler into an exhausted
            # connection pool.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Auth endpoints get their own, much stricter bucket. They are the ones
        # an attacker sprays, and §123's per-account limit inside the
        # application cannot see an attack distributed across accounts.
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            limit_req zone=general burst=60 nodelay;

            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
