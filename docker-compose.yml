# ===========================================================================
# Local development infrastructure (taskbook §4.10, PHASE 1 P1-T01..T03)
# ===========================================================================
#   make infra-up     start
#   make infra-logs   tail
#   make infra-down   stop (volumes preserved)
#
# Application services (api, worker, render-worker, web) join this file once
# they are containerised — their Dockerfiles depend on the settings layer that
# lands in PHASE 2. Until then developers run the apps on the host with
# `make dev` against this infrastructure.
# ===========================================================================

name: aipvs

services:
  # -------------------------------------------------------------------------
  # P1-T01 PostgreSQL
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: aipvs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aipvs}
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aipvs}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # P1-T02 Redis — cache, Celery broker, rate limiting, circuit-breaker state
  # -------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: aipvs-redis
    restart: unless-stopped
    # appendonly keeps queued jobs across a restart. Job state is authoritative
    # in Postgres regardless (ADR-0004), but losing the queue costs latency.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # -------------------------------------------------------------------------
  # P1-T03 MinIO — S3-compatible object storage for local development
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aipvs-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------------------------------------------------------
  # One-shot: create the bucket and keep it private (§110 — never public).
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: aipvs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-aipvs-dev}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      mc anonymous set none \"local/$$S3_BUCKET\" &&
      echo \"bucket $$S3_BUCKET ready (private)\"
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
