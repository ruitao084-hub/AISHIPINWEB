[project]
name = "aipvs-backend-core"
version = "0.0.0"
description = "Shared domain, provider, storage and job primitives for the AIPVS API, worker and render worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.121.0",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.68",
    "httpx>=0.28.1",
    "email-validator>=2.3.0",
    "pillow>=11.4.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend_core"]
